# 포트폴리오 대시보드
#  - 코스피·코스닥·국내 ETF·미국 상장 주식/ETF 전체 시세를 받아 market-data 브랜치에 저장
#    (페이지는 사용자가 고른 매매일지에 있는 종목 파일만 골라 읽음 → 사용자는 매매일지.csv만 고치면 됨)
#  - 페이지는 GitHub Pages(gh-pages 브랜치)에 게시
#  - 평일 07:20 KST(미국 장 마감 후)·16:10 KST(한국 장 마감 후) 예약, 페이지 코드 push 시, 수동 실행
#  - 첫 실행은 종목 수가 많아 며칠(실행당 최대 4,000종목)에 걸쳐 2년치 시세가 채워집니다.
name: daily_portfolio-dashboard

on:
  schedule:
    - cron: "20 22 * * 0-4"   # UTC 일~목 22:20 = KST 월~금 07:20
    - cron: "10 7 * * 1-5"    # UTC 월~금 07:10 = KST 월~금 16:10
  push:
    branches: [main]
    paths:
      - "daily_portfolio-dashboard/**"
      - ".github/workflows/daily_portfolio-dashboard.yml"
  workflow_dispatch:
    inputs:
      backfill:
        description: "이번 실행에서 새로 받을 종목 수 상한"
        default: "4000"

permissions:
  contents: write

jobs:
  # 1) 시세: 오래 걸릴 수 있어 gh-pages 잠금과 분리 (다른 리포트 게시를 막지 않음)
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency: { group: market-data, cancel-in-progress: false }
    env:
      TZ: Asia/Seoul
      REPORT: daily_portfolio-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: 지난 시세 가져오기
        run: |
          git clone --depth 1 --branch market-data "https://github.com/${GITHUB_REPOSITORY}.git" _data \
            && rm -rf _data/.git || mkdir -p _data/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REPORT }}/requirements.txt

      - name: 패키지 설치
        run: pip install -q -r "$REPORT/requirements.txt"

      - name: 전 종목 시세 받기
        run: |
          python "$REPORT/build.py" --data _data/data \
            --backfill "${{ inputs.backfill || '4000' }}"
          printf '# market-data\n자동 생성되는 시세 저장 브랜치입니다 (daily_portfolio-dashboard). 직접 고치지 마세요.\n' > _data/README.md

      - name: 시세 저장 (market-data 브랜치, 이력 없이 덮어쓰기)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: market-data
          publish_dir: ./_data
          force_orphan: true
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: market-data

  # 2) 페이지: 코드만 복사해 게시 (몇 초)
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: gh-pages, cancel-in-progress: false }   # 다른 리포트와 순서대로
    env:
      REPORT: daily_portfolio-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: 기존 게시본 가져오기 (다른 리포트 유지)
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" _site \
            && rm -rf _site/.git || mkdir -p _site

      - name: 페이지 복사
        run: python3 "$REPORT/build.py" --site "_site/$REPORT"

      - name: GitHub Pages 게시 (gh-pages, 이력 없이 덮어쓰기)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: ${{ env.REPORT }}
