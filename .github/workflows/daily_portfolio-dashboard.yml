# 포트폴리오 대시보드: 시세(prices.json)를 갱신하고 페이지를 GitHub Pages(gh-pages 브랜치)에 게시합니다.
#  - 평일 07:20 KST(미국 장 마감 후)·16:10 KST(한국 장 마감 후) 예약 (예약 실행은 수십 분 늦어질 수 있음)
#  - 페이지 코드나 tickers.json 을 바꿔 push 하면 바로 다시 게시
#  - Actions 탭 → daily_portfolio-dashboard → Run workflow 로 수동 실행 가능
#  - 매매일지(수량·금액)는 저장소에 올리지 않습니다. 페이지에서 CSV를 골라 브라우저 안에서만 읽습니다.
name: daily_portfolio-dashboard

on:
  schedule:
    - cron: "20 22 * * 0-4"   # UTC 일~목 22:20 = KST 월~금 07:20
    - cron: "10 7 * * 1-5"    # UTC 월~금 07:10 = KST 월~금 16:10
  push:
    branches: [main]
    paths:
      - "daily_portfolio-dashboard/**"
      - ".github/workflows/daily_portfolio-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # 여러 리포트가 동시에 gh-pages 를 덮어쓰지 않도록 순서대로 실행
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      REPORT: daily_portfolio-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: 기존 게시본 가져오기 (다른 리포트 유지)
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" _site \
            && rm -rf _site/.git || mkdir -p _site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REPORT }}/requirements.txt

      - name: 패키지 설치
        run: pip install -q -r "$REPORT/requirements.txt"

      - name: 시세 받기 · 페이지 복사
        run: python "$REPORT/build.py" --outdir "_site/$REPORT"

      - name: GitHub Pages 게시 (gh-pages, 이력 없이 덮어쓰기)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: ${{ env.REPORT }}
