# 매일 아침 시장 브리핑을 만들어 GitHub Pages(gh-pages 브랜치)에 게시합니다.
#  - 평일 06:30 KST 예약 (GitHub 예약 실행은 수십 분 늦어질 수 있음)
#  - Actions 탭 → daily_market-brief → Run workflow 로 수동 실행 가능
name: daily_market-brief

on:
  schedule:
    - cron: "30 21 * * 0-4"   # UTC 일~목 21:30 = KST 월~금 06:30 (겨울 미국 마감 06:00 이후)
  workflow_dispatch:
    inputs:
      force:
        description: "주말·휴장일에도 강제 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:            # 여러 리포트가 동시에 gh-pages 를 덮어쓰지 않도록 순서대로 실행
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      REPORT: daily_market-brief
    steps:
      - uses: actions/checkout@v4

      - name: 기존 게시본 가져오기 (지난 리포트 유지)
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" _site \
            && rm -rf _site/.git || mkdir -p _site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REPORT }}/requirements.txt

      - name: 한글 폰트 · 패키지 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q -r "$REPORT/requirements.txt"

      - name: 리포트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 선택(없어도 동작)
        run: |
          python "$REPORT/market_brief.py" --layout site --outdir "_site/$REPORT" \
            ${{ inputs.force && '--force' || '' }}

      - name: GitHub Pages 게시 (gh-pages, 이력 없이 덮어쓰기)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: ${{ env.REPORT }}
